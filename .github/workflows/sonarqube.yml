name: sonarqube

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  sonar-analysis:
    name: Analyze SnackTech
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
  
      - name: Install SonarScanner
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io" # Optional, but recommended
          SONAR_ORGANIZATION: "snacktechteam" # If you have an organization
          SONAR_PROJECT_KEY: "SnackTechTeam_infra-microsservicos" # Your project key
  